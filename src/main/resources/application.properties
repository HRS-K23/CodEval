# DSA Generator Application Configuration

# -----------------------------------------------
# Server
# -----------------------------------------------
server.port=8080

# -----------------------------------------------
# DataSource — H2 (dev/test)
# Override with env vars for production PostgreSQL:
#   SPRING_DATASOURCE_URL
#   SPRING_DATASOURCE_USERNAME
#   SPRING_DATASOURCE_PASSWORD
# -----------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/dsagenerator;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# -----------------------------------------------
# JPA / Hibernate
# -----------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# -----------------------------------------------
# H2 Console (dev only — disable in production)
# -----------------------------------------------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -----------------------------------------------
# Async — Audit executor
# -----------------------------------------------
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=4
